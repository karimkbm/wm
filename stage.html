<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="stage.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/stage-192.png">
<title>Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Thema: concertavond. Nachtblauw naar magenta, een gloeiende lightstick, fonkelende sterretjes. */
:root{
  --bg:#140c2b; --panel:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
  --ink:#fdf4ff; --muted:#d6bfe8; --pink:#ff5fb8; --lilac:#b07cff; --mint:#6ff2d6;
  --r:24px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,#120a2e 0%,#2a0f4d 45%,#5a1260 80%,#7a1b5e 100%);background-color:var(--bg);color:var(--ink);font:18px/1.35 Nunito,system-ui,sans-serif;overflow:hidden}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,200,255,.7);animation:tw 4s ease-in-out infinite;will-change:opacity}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.wrap{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1.15fr;gap:min(22px,2.5vh);padding:min(24px,3vh) 26px}
@media (orientation:portrait){.wrap{grid-template-columns:1fr;grid-auto-rows:min-content;overflow:auto}body{overflow:auto}}
.left,.right{display:flex;flex-direction:column;gap:min(18px,2.2vh);min-width:0;min-height:0}
.tag{font:800 .78rem Unbounded,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}
.top{display:flex;align-items:center;gap:22px}
.stick{flex:none;width:min(7vw,13vh);height:min(7vw,13vh);border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0 12%,#ffd1f0 22%,var(--pink) 48%,var(--lilac) 75%,transparent 76%);box-shadow:0 0 40px 10px rgba(255,95,184,.45);animation:glow 3.2s ease-in-out infinite;will-change:transform}
@keyframes glow{0%,100%{transform:scale(.94)}50%{transform:scale(1.04)}}
#tijd{font:800 min(8vw,16vh)/.95 Unbounded,sans-serif;letter-spacing:-.03em;background:linear-gradient(90deg,#fff,#ffd6f2 40%,var(--pink) 75%,var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;font-weight:800;font-size:1.3rem}
#week{color:var(--muted);text-transform:none;font-size:1rem;font-weight:700}
#weer{display:flex;align-items:center;gap:10px;font-size:1.05rem;color:var(--muted)}
#weer svg{width:30px;height:30px;color:var(--mint)}
#weer b{font:800 1.4rem Unbounded,sans-serif;color:var(--ink)}
.quote{border-radius:var(--r);padding:22px 24px;background:linear-gradient(135deg,rgba(255,95,184,.28),rgba(176,124,255,.22));border:1.5px solid rgba(255,255,255,.22)}
#quote{font:800 clamp(1rem,min(2.2vw,3.9vh),1.8rem)/1.22 Nunito,sans-serif;margin:8px 0 0;text-wrap:balance}
.aftel{display:flex;align-items:center;gap:18px;border-radius:var(--r);padding:16px 22px;background:linear-gradient(90deg,var(--lilac),var(--pink));margin-top:auto;box-shadow:0 8px 30px rgba(255,95,184,.3)}
.aftel .n{font:800 min(3rem,7vh)/1 Unbounded,sans-serif}
.aftel .u{font-weight:800;font-size:1rem;display:block}
.aftel .t{font-weight:800;font-size:1.15rem;line-height:1.2}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 20px;min-height:0;display:flex;flex-direction:column;gap:8px}
.panel h2{margin:0;display:flex;align-items:center;gap:10px;font:800 1rem Unbounded,sans-serif;color:#ffd6f2}
.panel h2 svg{width:22px;height:22px;color:var(--pink);flex:none}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:grid;grid-template-columns:6.4em 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
li:first-child{border-top:0}
li time{font-weight:800;color:var(--muted);font-size:.92rem}
li.soon time{color:var(--mint)}
li b{display:block;font-weight:800;line-height:1.25}
li small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
li.leeg{display:block;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0;flex:1 1 auto}
.duo .panel{height:100%}
.duo li{grid-template-columns:1fr}
.duo li time{order:2;font-size:.85rem}
.foot{font-size:.75rem;color:#a98fc4;text-align:right}
@media (max-height:760px) and (orientation:landscape){body{font-size:16px}.panel{padding:12px 16px}li{padding:6px 0}.quote{padding:16px 20px}.stick{width:70px;height:70px}}
#wie{margin:10px 0 0;font:600 .9rem Nunito,sans-serif;opacity:.75;letter-spacing:.02em}
html,body{height:100%;margin:0}
.wrap{height:100vh;height:100dvh}
.left,.right{overflow:hidden}
.panel{flex:1 1 auto;min-height:0;overflow:hidden}
.panel h2{flex:none}
#fs{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;border:0;border-radius:999px;padding:10px 18px;font:700 .95rem system-ui,sans-serif;background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(4px)}
section.left{overflow:visible}
.panel.vast{flex:none}
@media (orientation:portrait){.wrap{height:auto}.left,.right,.panel{overflow:visible}}
</style>
</head>
<body data-src="data/stage.json">
<div class="stars" aria-hidden="true">
  <i style="left:8%;top:12%"></i><i style="left:22%;top:70%;animation-delay:1.3s"></i><i style="left:35%;top:30%;animation-delay:2.6s"></i>
  <i style="left:47%;top:85%;animation-delay:.7s"></i><i style="left:58%;top:8%;animation-delay:3.1s"></i><i style="left:66%;top:55%;animation-delay:1.9s"></i>
  <i style="left:78%;top:22%;animation-delay:.4s"></i><i style="left:88%;top:78%;animation-delay:2.2s"></i><i style="left:94%;top:40%;animation-delay:3.6s"></i>
  <i style="left:14%;top:45%;animation-delay:2.9s"></i>
</div>
<main class="wrap">
  <section class="left">
    <div class="top">
      <div class="stick" aria-hidden="true"></div>
      <div>
        <span class="tag">Backstage</span>
        <div id="tijd">--:--</div>
      </div>
    </div>
    <div class="sub"><span id="datum"></span><span id="week"></span></div>
    <div id="weer"></div>
    <div class="quote">
      <span class="tag">Quote van vandaag</span>
      <p id="quote" lang="en">Laden…</p>
      <p id="wie" hidden></p>
    </div>
    <div class="aftel" id="aftel" hidden>
      <div><span class="n" id="aftel-n"></span><span class="u" id="aftel-u"></span></div>
      <div class="t" id="aftel-t"></div>
    </div>
  </section>
  <section class="right">
    <div class="panel vast">
      <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.8" fill="currentColor"/><circle cx="17.5" cy="16" r="2.8" fill="currentColor"/></svg>Comebacks &amp; nieuw</h2>
      <ul id="nieuw" data-max="3"></ul>
    </div>
    <div class="panel">
      <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9a2 2 0 0 0 0 6v3h18v-3a2 2 0 0 0 0-6V6H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 6v12" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2"/></svg>Concerten dichtbij</h2>
      <ul id="concert" data-max="3"></ul>
    </div>
    <div class="duo">
      <div class="panel">
        <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z" fill="currentColor"/></svg>BTS</h2>
        <ul id="bts" data-max="2"></ul>
      </div>
      <div class="panel">
        <h2><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v10H5zM3 7h18v4H3zM12 7v14M12 7c-2-4-6-3-5 0M12 7c2-4 6-3 5 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>Jarig</h2>
        <ul id="jarig" data-max="2"></ul>
      </div>
    </div>
    <div class="foot" id="bijgewerkt"></div>
  </section>
</main>
<button id="fs" type="button" hidden>Tik voor volledig scherm</button>
<script src="app.js?v=3"></script>
</body>
</html>
