<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wat eten we?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Gastenversie van de keuken-app: alleen kijken, niets aanpassen. */
:root{--bg:#F2F5F3;--surface:#fff;--sunk:#E6ECE9;--line:#D3DCD8;--ink:#14302B;--muted:#5A6F6A;--accent:#0E6B5C;--accent-ink:#fff;--accent-soft:#D8EDE8;--saffron:#E3A21A;--saffron-soft:#FBEFD2;--saffron-ink:#5A3E00;--ice:#2E6FA8;--ice-soft:#E1ECF7;--r:16px;
--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.45 var(--body);padding:0 22px 30px}
button{font:inherit;color:inherit;cursor:pointer}
.tiles{height:10px;margin:0 -22px;background:conic-gradient(from 45deg at 50% 50%,var(--accent) 0 25%,transparent 0 50%,var(--saffron) 0 75%,transparent 0) 0 0/20px 10px;opacity:.85}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px 20px;padding:18px 0}
.date{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font:800 2.3rem/1 var(--display);margin:4px 0 0;letter-spacing:-.02em}
#tijd{font:800 3rem/1 var(--display);font-variant-numeric:tabular-nums}
.tabs{display:flex;background:var(--sunk);border-radius:14px;padding:4px;gap:4px;margin-bottom:18px;max-width:560px}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:10px;font-weight:700;color:var(--muted);min-height:48px}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.hero{width:100%;text-align:left;border:0;border-radius:20px;padding:26px 28px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;gap:8px}
.hero.t-restjes{background:var(--saffron-soft);color:var(--saffron-ink)}
.hero.t-vriezer,.hero.t-flexibel{background:var(--ice-soft);color:var(--ice)}
.hero strong{font:800 clamp(1.8rem,3.4vw,2.7rem)/1.08 var(--display);letter-spacing:-.01em}
.hero .date{color:inherit;opacity:.85}
.hero .go{margin-top:6px;font-weight:700;opacity:.9}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.day{display:grid;grid-template-columns:64px 1fr 20px;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-top:1.5px solid var(--line);background:none;padding:12px 16px}
.day:first-child{border-top:0}
.day.today{background:var(--accent-soft)}
.day.past{opacity:.55}
.dn{text-align:center}.dn b{display:block;font:800 1.6rem/1 var(--display)}.dn span{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dt b{display:block;font-weight:700;line-height:1.25}.dt small{color:var(--muted)}
.chev{width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(-45deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:700}
.chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input[type=search]{width:100%;max-width:560px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:var(--surface);margin-bottom:12px;min-height:50px}
.rec{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:13px 16px;min-height:56px}
.rec:first-child{border-top:0}
.rec b{font-weight:700}.rec small{display:block;color:var(--muted);font-size:.85rem}
.star{color:var(--saffron);font-size:1.2rem}
.empty{padding:16px;color:var(--muted)}
.sheet{position:fixed;inset:0;background:rgba(10,25,22,.45);display:flex;justify-content:center;align-items:flex-start;padding:30px 16px;overflow-y:auto;z-index:10}
.box{background:var(--surface);border-radius:20px;padding:24px;width:min(720px,100%);display:flex;flex-direction:column;gap:14px}
.box h2{font:800 1.7rem/1.1 var(--display);margin:0}
.box .meta{color:var(--muted)}
.dh{font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.box ul,.box ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.uitleg{white-space:pre-line;font-size:.95rem}
.label{border:1.5px solid var(--ink);border-radius:8px;padding:8px 12px;font-size:.9rem;font-variant-numeric:tabular-nums;max-width:360px}
.label .lt{font-weight:700;border-bottom:4px solid var(--ink);padding-bottom:4px;margin-bottom:4px;display:flex;justify-content:space-between}
.label .row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:2px 0}
.label .row.sub{padding-left:14px;color:var(--muted)}
.label .row:last-child{border-bottom:0}
.close{align-self:flex-end;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 18px;font-weight:700;min-height:48px}
a{color:var(--accent);font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="tiles" aria-hidden="true"></div>
<header>
  <div><div class="date" id="datum"></div><h1>Wat eten we?</h1></div>
  <div id="tijd">--:--</div>
</header>
<div class="tabs" role="tablist">
  <button role="tab" id="t-week" aria-selected="true" type="button">Deze week</button>
  <button role="tab" id="t-rec" aria-selected="false" type="button">Recepten</button>
</div>
<main id="v-week" class="grid">
  <div><button class="hero" type="button" id="hero"><span class="date" id="hero-label">Vanavond</span><strong id="hero-titel">Laden…</strong><span class="go">Bekijk het recept <span aria-hidden="true">→</span></span></button></div>
  <div class="card" id="week"></div>
</main>
<main id="v-rec" hidden>
  <input type="search" id="zoek" placeholder="Zoek een recept…" aria-label="Zoek een recept">
  <div class="chips" id="soorten"></div>
  <div class="card" id="recepten"></div>
</main>
<div class="sheet" id="sheet" hidden><div class="box" id="box" role="dialog" aria-modal="true"></div></div>
<script>
(function(){
var D=["zo","ma","di","wo","do","vr","za"],DL=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"],M=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pad(n){return(n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
var data={week:[],recepten:[]},soort="alle";
function klok(){var d=new Date();$("tijd").textContent=pad(d.getHours())+":"+pad(d.getMinutes());$("datum").textContent=DL[d.getDay()]+" "+d.getDate()+" "+M[d.getMonth()];if(d.getHours()===4&&d.getMinutes()===0)location.reload()}
function label(v){if(!v)return"";function r(n,val,u,s){return'<div class="row'+(s?" sub":"")+'"><span>'+n+'</span><span>'+val+" "+u+"</span></div>"}
 return'<div class="label"><div class="lt"><span>Voedingswaarde per 100 g</span><span>schatting</span></div>'+r("Energie",v.kj+" kJ / "+v.kcal,"kcal")+r("Vetten",v.vet,"g")+r("waarvan verzadigd",v.verz,"g",1)+r("Koolhydraten",v.kh,"g")+r("waarvan suikers",v.suikers,"g",1)+r("Vezels",v.vezels,"g")+r("Eiwitten",v.eiwit,"g")+r("Zout",v.zout,"g")+"</div>"}
function open(html){$("box").innerHTML=html+'<button class="close" type="button" id="sluit">Sluiten</button>';$("sheet").hidden=false;$("sluit").onclick=dicht;$("sluit").focus()}
function dicht(){$("sheet").hidden=true}
$("sheet").onclick=function(e){if(e.target===$("sheet"))dicht()};
function toonDag(d){var dt=parse(d.datum);var h='<div class="date">'+DL[dt.getDay()]+" "+dt.getDate()+" "+M[dt.getMonth()]+'</div><h2>'+esc(d.titel)+"</h2>";
 if(d.tijd)h+='<div class="meta">'+esc(d.tijd)+"</div>";
 if(d.ingredienten&&d.ingredienten.length)h+='<div><div class="dh">Ingrediënten</div><ul>'+d.ingredienten.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+"</ul></div>";
 if(d.bereiding&&d.bereiding.length)h+='<div><div class="dh">Bereiding</div><ol>'+d.bereiding.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+"</ol></div>";
 if(!(d.ingredienten&&d.ingredienten.length)&&!(d.bereiding&&d.bereiding.length))h+='<div class="meta">Geen recept nodig voor deze avond.</div>';
 h+=label(d.voeding);open(h)}
function toonRec(r){var h='<div class="date">'+esc(r.soort||"recept")+'</div><h2>'+esc(r.titel)+"</h2>";
 if(r.uitleg)h+='<div class="uitleg">'+esc(r.uitleg)+"</div>";
 if(r.link)h+='<div><a href="'+esc(r.link)+'" target="_blank" rel="noopener">Bekijk het originele recept</a></div>';
 else if(r.bron)h+='<div class="meta">Bron: '+esc(r.bron)+"</div>";
 open(h)}
function renderWeek(){var v=iso(new Date()),w=data.week,idx=0;
 for(var i=0;i<w.length;i++){if(w[i].datum===v){idx=i;break}}
 var u=new Date().getHours()>=20&&w[idx+1]?idx+1:idx,hd=w[u];
 if(hd){$("hero").className="hero t-"+(hd.type||"koken");$("hero-label").textContent=u===idx?"Vanavond":"Morgen";$("hero-titel").textContent=hd.titel;$("hero").onclick=function(){toonDag(hd)}}
 $("week").innerHTML=w.map(function(d,i){var dt=parse(d.datum);return'<button class="day'+(d.datum===v?" today":"")+(d.datum<v?" past":"")+'" type="button" data-i="'+i+'"><div class="dn"><span>'+D[dt.getDay()]+"</span><b>"+dt.getDate()+'</b></div><div class="dt"><b>'+esc(d.titel)+"</b>"+(d.tijd?"<small>"+esc(d.tijd)+"</small>":"")+'</div><span class="chev" aria-hidden="true"></span></button>'}).join("")||'<div class="empty">Het weekmenu volgt nog.</div>';
 Array.prototype.forEach.call($("week").querySelectorAll("[data-i]"),function(b){b.onclick=function(){toonDag(w[+b.getAttribute("data-i")])}})}
function renderRec(){var q=$("zoek").value.trim().toLowerCase(),soorten={};data.recepten.forEach(function(r){if(r.soort)soorten[r.soort]=1});
 $("soorten").innerHTML=["alle"].concat(Object.keys(soorten).sort()).map(function(s){return'<button type="button" data-s="'+esc(s)+'" aria-pressed="'+(s===soort)+'">'+esc(s==="alle"?"Alles":s)+"</button>"}).join("");
 Array.prototype.forEach.call($("soorten").querySelectorAll("[data-s]"),function(b){b.onclick=function(){soort=b.getAttribute("data-s");renderRec()}});
 var lijst=data.recepten.filter(function(r){return(soort==="alle"||r.soort===soort)&&(!q||r.titel.toLowerCase().indexOf(q)>=0)});
 $("recepten").innerHTML=lijst.map(function(r,i){return'<button class="rec" type="button" data-r="'+data.recepten.indexOf(r)+'"><span><b>'+esc(r.titel)+"</b><small>"+esc(r.soort||"")+"</small></span>"+(r.favoriet?'<span class="star" aria-label="favoriet">★</span>':"")+"</button>"}).join("")||'<div class="empty">Niets gevonden.</div>';
 Array.prototype.forEach.call($("recepten").querySelectorAll("[data-r]"),function(b){b.onclick=function(){toonRec(data.recepten[+b.getAttribute("data-r")])}})}
function tab(w){$("t-week").setAttribute("aria-selected",w==="week");$("t-rec").setAttribute("aria-selected",w==="rec");$("v-week").hidden=w!=="week";$("v-rec").hidden=w!=="rec"}
$("t-week").onclick=function(){tab("week")};$("t-rec").onclick=function(){tab("rec")};$("zoek").oninput=renderRec;
function laad(){var x=new XMLHttpRequest();x.open("GET","data/keuken.json?t="+Date.now());x.onload=function(){try{data=JSON.parse(x.responseText);try{localStorage.setItem("keuken",x.responseText)}catch(e){}renderWeek();renderRec()}catch(e){}};x.send()}
try{var c=localStorage.getItem("keuken");if(c){data=JSON.parse(c);renderWeek();renderRec()}}catch(e){}
klok();setInterval(klok,15000);laad();setInterval(laad,30*60000);
})();
</script>
</body>
</html>
